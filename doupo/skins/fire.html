<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>样稿 B · 异火</title>
<style>
@font-face{font-family:"DP Num";src:url(https://testingcf.jsdelivr.net/npm/@fontsource/zcool-qingke-huangyou@5/files/zcool-qingke-huangyou-latin-400-normal.woff2) format("woff2");unicode-range:U+0020-007E,U+00B7;font-display:swap}
:root{
  --bg0:#03050b; --bg1:#070c19; --bg2:#0c1427; --line:rgba(130,200,225,.15);
  --fl:#3df2c4; --fl2:#12b6a8; --fl-hi:#eafff8; --bone:#eef3ff;
  --rose:#ff5d7a; --vio:#b193ff; --amb:#ffc267;
  --tx:#d3e2ec; --tx2:#8ba0b3; --tx3:#566779;
  --f-script:"Long Cang","Ma Shan Zheng","KaiTi",cursive;
  --f-hud:"DP Num","LXGW WenKai Screen","KaiTi",serif;
  --f-body:"LXGW WenKai Screen","KaiTi","Noto Serif SC",serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#17171a;color:#cfcbc4;font-family:var(--f-body);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ───── 演示外壳（不属于状态栏本体） ───── */
.demo-bar{position:fixed;z-index:50;top:10px;left:12px;display:flex;gap:10px;align-items:center;font:500 12px/1 "Noto Serif SC",serif;color:#8a8a90}
.demo-bar b{color:#e8e4dc;letter-spacing:.2em}
.demo-bar a{color:#8a8a90;text-decoration:none;padding:5px 8px;border:1px solid #2e2e33}
.demo-bar a:hover{color:#fff;border-color:#666}
.stage{height:100%;max-width:980px;margin:0 auto;display:flex;flex-direction:column;background:#1d1d21;border-inline:1px solid #26262b}
.chat{flex:1;min-height:0;overflow:hidden;padding:54px 26px 0;display:flex;flex-direction:column;gap:14px;font:400 14px/1.9 "Noto Serif SC",serif;color:#8d8a84}
.chat p{max-width:62ch;padding:12px 16px;background:#232328;border-left:2px solid #34343b}
.mock-input{height:46px;background:#141417;border-top:1px solid #2a2a30;display:flex;align-items:center;padding:0 18px;color:#55555c;font-size:13px}

/* ───── 状态栏本体 ───── */
#dp{position:relative;flex:none;color:var(--tx);font-family:var(--f-body)}
.hud{font-family:var(--f-hud);font-weight:400}
.script{font-family:var(--f-script);font-weight:400}
/* 火苗：一滴水形状转 45°，再让它抖 */
.drop{display:inline-block;width:var(--s,10px);height:var(--s,10px);border-radius:0 50% 50% 50%;transform:rotate(45deg);background:radial-gradient(circle at 68% 68%,#fff,var(--c,var(--fl)) 45%,color-mix(in srgb,var(--c,var(--fl)) 35%,transparent));box-shadow:0 0 calc(var(--s,10px)*.9) var(--c,var(--fl));animation:flick 1.1s ease-in-out infinite alternate}
@keyframes flick{0%{transform:rotate(45deg) scale(1,1)}35%{transform:rotate(41deg) scale(.9,1.14)}70%{transform:rotate(49deg) scale(1.08,.94)}100%{transform:rotate(44deg) scale(.95,1.1)}}

/* ── 底栏 ── */
.dock{position:relative;display:flex;align-items:stretch;height:66px;background:linear-gradient(180deg,#0a1122,#04060c);border-top:1px solid rgba(61,242,196,.5)}
.strip{position:absolute;left:0;right:0;bottom:100%;width:100%;height:54px;pointer-events:none;mix-blend-mode:screen;z-index:6}
.dock>*{position:relative;display:flex;align-items:center}
.dk-core{flex:none;gap:10px;padding:0 16px 0 12px}
.dk-core svg{width:48px;height:48px;overflow:visible}
.dk-core b{font:400 36px/1 "Zhi Mang Xing",var(--f-script);color:var(--bone);text-shadow:0 0 14px var(--fl),0 0 2px var(--fl2)}
.dk-core small{font:400 12px/1 var(--f-hud);letter-spacing:.3em;color:var(--fl);writing-mode:vertical-rl}
.dk-id{flex:none;flex-direction:column;align-items:flex-start;justify-content:center;gap:6px;padding:0 18px 0 6px}
.dk-id b{font:400 19px/1 var(--f-hud);letter-spacing:.2em;color:#fff}
.dk-id small{font-size:11.5px;color:var(--tx2);white-space:nowrap}
.dk-m{flex:1 1 190px;min-width:140px;flex-direction:column;align-items:stretch;justify-content:center;gap:11px;padding:0 18px}
.mini{display:grid;grid-template-columns:14px 1fr 26px;align-items:center;gap:9px;font:400 12px/1 var(--f-hud);color:var(--tx2)}
.mini b{font:400 17px/1 var(--f-hud);text-align:right;color:var(--c)}
.dk-scene{flex:1 1 210px;min-width:0;flex-direction:column;align-items:flex-start;justify-content:center;gap:7px;padding:0 16px;border-left:1px solid var(--line)}
.dk-scene b{font:400 14px/1 var(--f-hud);letter-spacing:.14em;color:var(--amb);white-space:nowrap}
.dk-scene b i{font-style:normal;font-family:var(--f-body);font-size:11px;color:var(--tx2);margin-left:8px;letter-spacing:.1em}
.dk-scene span{font-size:12.5px;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.dk-cast{flex:none;gap:9px;padding:0 14px}
.pm{width:var(--z,34px);height:var(--z,34px);display:grid;place-items:center;border-radius:62% 0 62% 0;border:1px solid color-mix(in srgb,var(--c) 70%,transparent);background:radial-gradient(circle at 30% 30%,color-mix(in srgb,var(--c) 30%,transparent),rgba(4,6,12,.9) 70%);box-shadow:0 0 12px color-mix(in srgb,var(--c) 45%,transparent),inset 0 0 8px color-mix(in srgb,var(--c) 25%,transparent);font:400 calc(var(--z,34px)*.62)/1 var(--f-script);color:#fff;transition:transform .35s cubic-bezier(.3,1.6,.4,1),border-radius .35s}
button.pm:hover{transform:rotate(-8deg) scale(1.1);border-radius:0 62% 0 62%}
.pm[data-off]{--c:#5a6a7c;color:var(--tx2);box-shadow:none}
.dk-toggle{flex:none;width:56px;justify-content:center;border-left:1px solid var(--line)}
.dk-toggle svg{width:18px;height:18px;color:var(--fl);transition:transform .5s cubic-bezier(.3,1.5,.4,1)}
#dp[data-open="true"] .dk-toggle svg{transform:rotate(180deg)}

/* 细线量条 + 尽头一簇火 */
.meter{position:relative;height:3px;background:rgba(255,255,255,.09)}
.meter i{position:absolute;inset:0 auto 0 0;width:calc(var(--v)*1%);background:linear-gradient(90deg,transparent,var(--c) 60%,#fff);box-shadow:0 0 10px var(--c);animation:grow 1.2s cubic-bezier(.2,.7,.2,1) both}
.meter i::after{content:"";position:absolute;right:-5px;top:-9px;width:10px;height:10px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:radial-gradient(circle at 68% 68%,#fff,var(--c) 55%,transparent);box-shadow:0 0 9px var(--c);animation:flick .9s ease-in-out infinite alternate}
@keyframes grow{from{width:0}}

/* ── 面板 ── */
.panel{position:absolute;left:0;right:0;bottom:100%;height:min(640px,calc(100vh - 190px));display:flex;flex-direction:column;overflow:hidden;transform-origin:50% 100%;transition:clip-path .6s cubic-bezier(.2,.8,.2,1),opacity .35s;clip-path:polygon(0 22px,22px 0,100% 0,100% 100%,0 100%)}
#dp[data-open="false"] .panel{clip-path:polygon(0 100%,0 100%,100% 100%,100% 100%,0 100%);opacity:0;pointer-events:none}
.panel-bg{position:absolute;inset:0;background:radial-gradient(70% 62% at 50% 112%,rgba(18,182,168,.34),transparent 62%),radial-gradient(46% 50% at 92% -6%,rgba(177,147,255,.2),transparent 70%),radial-gradient(40% 44% at 4% 8%,rgba(255,93,122,.1),transparent 70%),linear-gradient(180deg,#060a15,#03050b)}
.aurora{position:absolute;width:60%;height:70%;left:-10%;top:10%;background:radial-gradient(closest-side,rgba(61,242,196,.13),transparent);filter:blur(30px);animation:drift 19s ease-in-out infinite alternate}
.aurora+.aurora{left:55%;top:-20%;background:radial-gradient(closest-side,rgba(177,147,255,.14),transparent);animation-duration:27s;animation-direction:alternate-reverse}
@keyframes drift{to{transform:translate(22%,14%) scale(1.25)}}
.wheel{position:absolute;right:-150px;top:-150px;width:460px;height:460px;opacity:.13;animation:spin 220s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panel-edge{position:absolute;inset:0;pointer-events:none}
.panel-edge path{fill:none;stroke:url(#edgeg);stroke-width:1.2}
#sparks{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4;mix-blend-mode:screen}
.tabs{position:relative;z-index:5;flex:none;display:flex;gap:4px;padding:18px 24px 0 40px}
.tab{position:relative;padding:8px 14px 14px;font:400 16px/1 var(--f-hud);letter-spacing:.3em;color:var(--tx3);transition:color .3s,text-shadow .3s}
.tab:hover{color:var(--tx)}
.tab[aria-selected="true"]{color:#fff;text-shadow:0 0 14px var(--fl)}
.tab-ind{position:absolute;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--fl),transparent);transition:left .55s cubic-bezier(.3,1.3,.4,1),width .55s cubic-bezier(.3,1.3,.4,1)}
.tab-ind .drop{position:absolute;left:50%;top:-12px;margin-left:-5px}
.tabs::after{content:"";position:absolute;left:24px;right:24px;bottom:0;height:1px;background:var(--line)}
.body{position:relative;z-index:3;flex:1;min-height:0;overflow:auto;padding:22px 30px 64px;scrollbar-width:thin;scrollbar-color:#1c3a48 transparent}
.pg{animation:pgin .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes pgin{from{opacity:0;transform:translateY(12px);filter:blur(6px)}}
.cap{display:flex;align-items:center;gap:12px;margin:26px 0 12px;font:400 15px/1 var(--f-hud);letter-spacing:.5em;color:var(--tx2)}
.cap:first-child{margin-top:0}
.cap::before{content:"";width:9px;height:9px;border-radius:0 50% 50% 50%;transform:rotate(45deg);background:var(--fl);box-shadow:0 0 10px var(--fl)}
.cap::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.cap small{font-size:13px;letter-spacing:.1em;color:var(--fl)}

/* ── 修为页：火莲 + 经脉 ── */
.who{display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.who-n{font:400 66px/.95 var(--f-script);background:linear-gradient(120deg,#fff 20%,var(--fl) 70%,var(--vio));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(61,242,196,.45));padding:0 6px}
.who-r{display:flex;flex-direction:column;gap:7px;padding-bottom:6px}
.who-r b{font:400 16px/1 var(--f-hud);letter-spacing:.2em;color:#fff}
.who-r span{font-size:12.5px;color:var(--tx2)}
.chart{position:relative;display:grid;grid-template-columns:1fr 300px 1fr;align-items:center;margin-top:4px;min-height:330px}
.mer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mer-b{fill:none;stroke:rgba(130,200,225,.42);stroke-width:1}
.mer-l{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-dasharray:3 14 22 120;animation:pulse 2.6s linear infinite;filter:drop-shadow(0 0 4px currentColor)}
@keyframes pulse{from{stroke-dashoffset:159}to{stroke-dashoffset:0}}
.col{display:flex;flex-direction:column;gap:30px;position:relative;z-index:2}
.node{position:relative;--c:var(--fl)}
.col.l .node{padding-right:26px;text-align:right}
.col.r .node{padding-left:26px}
.node-a{position:absolute;top:27px;width:7px;height:7px;transform:rotate(45deg);background:var(--c);box-shadow:0 0 10px 2px var(--c)}
.col.l .node-a{right:0}.col.r .node-a{left:0}
.node-k{font:400 13px/1 var(--f-hud);letter-spacing:.45em;color:var(--tx2)}
.col.l .node-k{margin-right:-.45em}
.node-v{display:block;margin-top:6px;font:400 46px/1 var(--f-hud);color:var(--c);text-shadow:0 0 20px color-mix(in srgb,var(--c) 65%,transparent)}
.node-v.script{font:400 42px/1.05 var(--f-script)}
.node-v small{font:400 13px/1 var(--f-hud);letter-spacing:.2em;color:var(--tx2);margin-left:8px;text-shadow:none}
.node .meter{margin-top:10px}
.node p{margin-top:6px;font-size:13px;line-height:1.7;color:var(--tx)}
.buds{display:inline-flex;gap:5px;margin-top:9px}
.buds i{width:8px;height:11px;border-radius:50% 50% 50% 50%/70% 70% 30% 30%;border:1px solid color-mix(in srgb,var(--c) 45%,transparent)}
.buds i.on{background:var(--c);box-shadow:0 0 8px var(--c)}

.lotus{position:relative;width:300px;height:300px;cursor:pointer;z-index:1}
.lotus canvas{position:absolute;left:-30px;bottom:44px;width:360px;height:370px;pointer-events:none;mix-blend-mode:screen}
.lotus svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.lt-spin{transform-origin:0 0;animation:spin 90s linear infinite}
.lt-spin.rev{animation-duration:60s;animation-direction:reverse}
.petal{fill:rgba(61,242,196,.06);stroke:rgba(120,235,212,.6);stroke-width:1}
.petal.on{fill:url(#dp-pg);stroke:#eafff8;stroke-width:.8;filter:drop-shadow(0 0 7px #3df2c4);animation:lit 1.6s ease-in-out infinite alternate,bloom .7s cubic-bezier(.3,1.8,.4,1) both;animation-delay:calc(var(--i)*-.37s),calc(.5s + var(--i)*.14s)}
@keyframes lit{from{opacity:.78}to{opacity:1}}
@keyframes bloom{from{transform:rotate(var(--r)) scale(0)}}
.lt-arc{fill:none;stroke:url(#dp-ag);stroke-width:3.5;stroke-linecap:round;filter:drop-shadow(0 0 6px #3df2c4);stroke-dasharray:578;animation:arc 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes arc{from{stroke-dashoffset:578}}
.lt-core{position:absolute;inset:66px;border-radius:50%;background:radial-gradient(closest-side,rgba(3,5,11,.9) 55%,rgba(3,5,11,.55) 80%,transparent);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.lt-core b{font:400 var(--mz,84px)/.95 "Zhi Mang Xing",var(--f-script);color:var(--bone);text-shadow:0 0 20px var(--fl),0 0 3px var(--fl2);white-space:nowrap;animation:pgin .8s .2s both}
.lt-core span{font:400 14px/1 var(--f-hud);letter-spacing:.5em;margin-right:-.5em;color:var(--fl)}
.lt-core em{font:400 12px/1 var(--f-hud);font-style:normal;letter-spacing:.2em;color:var(--tx2)}
.lt-core em u{text-decoration:none;color:var(--amb);font-size:15px}

/* 十二焰阶 */
.steps{position:relative;display:grid;grid-template-columns:repeat(12,1fr);align-items:end;margin-top:18px;padding-top:10px}
.steps::before{content:"";position:absolute;left:4%;right:4%;bottom:24px;height:1px;background:var(--line)}
.steps::after{content:"";position:absolute;left:4%;bottom:24px;height:1px;width:calc(92%*var(--at));background:linear-gradient(90deg,transparent,var(--fl));box-shadow:0 0 8px var(--fl);animation:grow 1.8s cubic-bezier(.2,.7,.2,1) both}
.step{display:flex;flex-direction:column;align-items:center;gap:14px;font:400 12px/1 var(--f-hud);letter-spacing:.04em;color:var(--tx3);white-space:nowrap}
.step i{width:var(--s);height:var(--s);border-radius:0 50% 50% 50%;transform:rotate(45deg);border:1px solid rgba(130,200,225,.3);margin-bottom:6px}
.step.past{color:var(--fl2)}
.step.past i{border:0;background:radial-gradient(circle at 68% 68%,var(--fl),var(--fl2) 60%,transparent);box-shadow:0 0 8px var(--fl2)}
.step.cur{color:#fff;font-size:16px;text-shadow:0 0 12px var(--fl)}
.step.cur i{border:0;background:radial-gradient(circle at 68% 68%,#fff,var(--fl) 50%,rgba(61,242,196,.2));box-shadow:0 0 18px 2px var(--fl);animation:flick .9s ease-in-out infinite alternate}
.looks{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:6px 12px;margin-top:20px;font-size:12.5px;line-height:1.7;color:var(--tx)}
.looks dt{font:400 12px/1.9 var(--f-hud);letter-spacing:.3em;color:var(--fl2)}

/* ── 斗技页 ── */
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2px 26px}
.art{position:relative;display:grid;grid-template-columns:58px 1fr auto;gap:2px 14px;align-items:center;padding:14px 10px 14px 4px;border-bottom:1px solid var(--line);overflow:hidden}
.art::before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,color-mix(in srgb,var(--g) 14%,transparent) 50%,transparent 80%);translate:-100% 0;transition:translate .8s ease}
.art:hover::before{translate:100% 0}
.ring{grid-row:1/3;position:relative;width:58px;height:58px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:2.5}
.ring .t{stroke:rgba(255,255,255,.08)}
.ring .p{stroke:var(--g);stroke-linecap:round;stroke-dasharray:157;filter:drop-shadow(0 0 5px var(--g));animation:ringin 1.4s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringin{from{stroke-dashoffset:157}}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:400 21px/1 var(--f-hud);color:#fff}
.art-n{font:400 31px/1 var(--f-script);color:#fff;text-shadow:0 0 14px color-mix(in srgb,var(--g) 55%,transparent)}
.tag{display:inline-block;margin-left:10px;padding:3px 9px 3px 8px;font:400 12px/1 var(--f-hud);letter-spacing:.14em;color:var(--bg0);background:var(--g);clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%);vertical-align:6px}
.tag.o{color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent)}
.art-s{font:400 15px/1 var(--f-hud);letter-spacing:.3em;color:var(--g)}
.art-e{grid-column:2/4;font-size:12.5px;line-height:1.7;color:var(--tx2)}
.art.big{grid-template-columns:96px 1fr auto;padding:8px 10px 20px 4px}
.art.big .ring{width:96px;height:96px}.art.big .ring b{font-size:34px}
.art.big .art-n{font-size:58px}
.art.big .art-e{font-size:13.5px;color:var(--tx)}

/* ── 人物页 ── */
.folk{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:4px 26px}
.per{position:relative;display:grid;grid-template-columns:52px 1fr;gap:3px 14px;padding:15px 6px 15px 2px;border-bottom:1px solid var(--line)}
.per .pm{--z:50px;grid-row:1/3;align-self:start}
.per-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.per-h b{font:400 20px/1 var(--f-hud);letter-spacing:.14em;color:#fff}
.per-h span{font-size:12.5px;color:var(--amb)}
.per-h i{margin-left:auto;font:400 12px/1 var(--f-hud);font-style:normal;letter-spacing:.2em;color:var(--tx3)}
.per[data-here="在场"] .per-h i{color:var(--fl);text-shadow:0 0 8px var(--fl)}
.per-r{font-size:13px;color:var(--tx)}
.per-r em{font-style:normal;color:var(--c)}
.per-f{grid-column:1/3;display:grid;grid-template-columns:34px 1fr 28px;align-items:center;gap:10px;margin-top:10px;font:400 12px/1 var(--f-hud);letter-spacing:.2em;color:var(--tx2);--c:var(--rose)}
.per-f b{font:400 17px/1 var(--f-hud);color:var(--rose);text-align:right;letter-spacing:0}
.per-t{grid-column:1/3;margin-top:8px;font-size:12.5px;line-height:1.7;color:var(--tx2)}
.heart{grid-column:1/3;margin-top:8px;padding:8px 0 8px 14px;border-left:1px solid var(--vio);font-size:13.5px;line-height:1.7;color:#e9e2ff;text-align:left;cursor:pointer;position:relative}
.heart span{filter:blur(5px);opacity:.5;transition:filter .7s,opacity .7s}
.heart::before{content:"心声 · 点开";position:absolute;right:0;top:-4px;font:400 11px/1 var(--f-hud);letter-spacing:.3em;color:var(--vio);transition:opacity .4s}
.heart.open span{filter:none;opacity:1}.heart.open::before{opacity:0}

/* ── 行囊 / 天机 ── */
.gear{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px 26px}
.gear article{padding:4px 0 12px 16px;border-left:1px solid var(--fl2);position:relative}
.gear article::before{content:"";position:absolute;left:-4px;top:8px;width:7px;height:7px;transform:rotate(45deg);background:var(--fl);box-shadow:0 0 10px var(--fl)}
.gear h4{font:400 34px/1 var(--f-script);color:#fff;text-shadow:0 0 14px rgba(61,242,196,.5)}
.gear small{display:block;margin-top:6px;font:400 12.5px/1 var(--f-hud);letter-spacing:.14em;color:var(--amb)}
.gear p{margin-top:7px;font-size:12.5px;line-height:1.7;color:var(--tx)}
.gear p+p{margin-top:2px;color:var(--tx2)}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0 26px}
.item{display:grid;grid-template-columns:1fr auto;gap:3px 10px;padding:11px 2px;border-bottom:1px solid var(--line);transition:padding .3s,background .3s}
.item:hover{padding-left:10px;background:linear-gradient(90deg,rgba(61,242,196,.08),transparent)}
.item b{font:400 17px/1.1 var(--f-hud);letter-spacing:.1em;color:#fff}
.item span{font:400 22px/1 var(--f-hud);color:var(--fl);text-align:right}

/* 人物档案的题头与修为图共用一张展开页。列数由档案本身可用空间决定。 */
.fed-full {gap:18px; padding-top:14px}
.fed-full::before {background:none}
.fd-lead {
  position:relative; display:grid; min-width:0;
  border:1px solid var(--fd-line);
  background:radial-gradient(ellipse at 0 0,var(--fd-faint),transparent 65%),var(--s0);
}
.fd-lead::before {
  content:''; position:absolute; z-index:1; top:-1px; left:-1px;
  height:12px; width:42px; border-top:2px solid var(--gold); border-left:1px solid var(--gold);
  pointer-events:none;
}
.fd-portrait {min-width:0; padding:20px; display:grid; align-content:center; gap:14px}
.fd-portrait header {display:flex; gap:10px; align-items:center}
.fd-kind {
  writing-mode:vertical-rl; padding:5px 3px; background:var(--fd-faint);
  border:1px solid var(--fd-line); color:var(--gold); font:11px/1 var(--fd-serif); letter-spacing:.14em;
}
.fed-full .fd-portrait h3 {font:600 clamp(26px,5cqi,40px)/1.2 var(--fd-serif); color:var(--gold-hi); margin:0; letter-spacing:.08em}
.fd-situation {font:14px/1.8 var(--fd-serif); color:var(--ash); white-space:pre-wrap}
.fd-situation b {display:block; font:10px/1.7 sans-serif; color:var(--ash2); letter-spacing:.15em}
.fd-facts {display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px 14px; margin:0}
.fd-facts div {min-width:0; border-top:1px solid var(--fd-line); padding-top:6px}
.fd-facts dt {font-size:11px; color:var(--ash2)}
.fd-facts dd {margin:2px 0 0; color:var(--ash); font-size:13px; line-height:1.6; white-space:pre-wrap}
.fd-portrait .fed-aff {border-top:1px solid var(--fd-line); padding-top:10px}
.fd-realm-frame {min-width:0; container:detail / inline-size; background:var(--s1); border-top:1px solid var(--fd-line)}
.fd-realm-frame > .fd-section {height:100%; display:flex; flex-direction:column}
.fd-realm-frame .fd-heading {padding:12px 16px 0; margin:0}
.fd-realm-frame .fd-realm {flex:1; border:0; box-shadow:none; background-color:transparent}
.fd-realm-frame .fd-realm:before {border:0}
.fd-realm-frame .fd-realm[data-realm=sky] {margin:12px 0 0}
.fd-realm-frame .fd-realm>.fd-realm-ladder {align-self:end}
.fd-voice-strip {
  display:grid; grid-template-columns:auto 1fr; align-items:baseline; gap:16px;
  padding:10px 16px; border-inline-start:2px solid var(--gold); background:var(--fd-faint);
}
.fd-voice-strip span {color:var(--gold); font:12px/1.8 var(--fd-serif); letter-spacing:.15em}
.fd-voice-strip p {color:var(--ash); font:14px/1.9 var(--fd-serif); white-space:pre-wrap}
.fd-pair,.fd-training,.fd-techniques {display:grid; gap:16px; align-items:start; min-width:0}
.fd-observations {padding:14px; border-block:1px solid var(--fd-line); background:var(--s1)}
.fd-observations .fd-facts {padding-bottom:8px}
.fd-observations .fd-facts div {border:0; padding:0}
.fd-observations .fed-kv {border-top:1px solid var(--fd-line)}
.fd-arts {grid-template-columns:repeat(auto-fit,minmax(min(100%,265px),1fr))}
.fd-soul-panel > .fd-glyph {width:48px;height:48px;margin-bottom:8px}
.fd-soul-panel strong {font-size:22px}
.fed-full .fd-arts > :only-child {grid-column:1/-1}
@container detail (min-width:620px) {
  .fd-lead {grid-template-columns:minmax(0,.88fr) minmax(0,1.12fr)}
  .fd-portrait {padding:22px 24px}
  .fd-realm-frame {border-top:0;border-left:1px solid var(--fd-line)}
  .fd-pair {grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px}
  .fd-arts > :only-child {display:grid;grid-template-columns:minmax(200px,.85fr) 1fr;gap:0 24px;align-items:center}
  .fd-arts > :only-child .fd-art-top {grid-row:1/3}
  .fd-arts > :only-child > .fed-kv {grid-column:2}
}
@container detail (min-width:355px) {
  .fd-realm-frame .fd-realm[data-realm=fire] {display:grid;grid-template-columns:minmax(124px,1fr) minmax(110px,.75fr);padding:16px 12px;align-items:center}
  .fd-realm-frame .fd-realm[data-realm=fire] .fd-realm-info {display:block;padding:8px 0 8px 12px;border-top:0;border-left:1px solid var(--fd-line)}
  .fd-realm-frame .fd-realm[data-realm=fire] .fd-realm-attr {margin:12px 0;justify-content:flex-start}
}
@container detail (max-width:619px) {
  .fd-portrait {padding:14px;gap:10px}
  .fd-portrait h3 {font-size:26px}
  .fd-lotus-stage {max-width:174px}
  .fd-stele-stage {height:200px}
  .fd-stele-stage .stele {transform:scale(.4)}
  .fd-voice-strip {padding:9px 12px}
}

window.DP = (() => {
  const D = ['一', '二', '三', '四', '五', '六', '七', '八', '九'];
  const MAJORS = ['斗之气', '斗者', '斗师', '大斗师', '斗灵', '斗王', '斗皇', '斗宗', '斗尊', '半圣', '斗圣', '斗帝'];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  function realm(s) {
    if (!s || s === '未初始化') return { ok: false, major: '未测', minor: '', idx: -1, stars: 0, unit: '' };
    if (s === '斗帝') return { ok: true, major: '斗帝', minor: '', idx: 11, stars: 9, unit: '' };
    if (s.startsWith('斗尊巅峰')) { const m = s.match(/·(.)转/u); return { ok: true, major: '斗尊', minor: m ? `巅峰${m[1]}转` : '巅峰', idx: 8, stars: 9, unit: '转' }; }
    if (s.startsWith('半圣')) { const lv = s.split('·')[1] || ''; return { ok: true, major: '半圣', minor: lv, idx: 9, stars: { 初级: 3, 中级: 6, 高级: 9 }[lv] || 0, unit: '级' }; }
    const [a, b = ''] = s.split('·');
    return { ok: true, major: a, minor: b, idx: MAJORS.indexOf(a), stars: D.indexOf(b[0]) + 1, unit: b.slice(1) };
  }
  const stage = n => n >= 100 ? '圆满' : n >= 75 ? '大成' : n >= 50 ? '小成' : n >= 25 ? '熟练' : n >= 1 ? '入门' : '未入门';
  const ATTR = { 火: '#ff7a22', 冰: '#9fdcf0', 风: '#7fe0b4', 雷: '#c2a2ff', 水: '#62b6ff', 木: '#86d06f', 土: '#c9a36a', 毒: '#b58ae0', 金: '#f2cf63' };
  const attr = a => { const k = Object.keys(ATTR).find(k => a && a.includes(k)); return k ? ATTR[k] : null; };
  const GRADE = { 黄: 1, 玄: 2, 地: 3, 天: 4 };
  const grade = g => GRADE[(g || '')[0]] || 0;
  const SOULS = ['凡境', '灵境', '天境', '帝境'], SOUL_STAGE = ['初期', '中期', '后期', '大圆满'];
  const PILL = ['学徒', '一品', '二品', '三品', '四品', '五品', '六品', '七品', '八品', '九品宝丹宗师', '九品玄丹宗师', '九品金丹宗师', '帝品'];
  const pill = g => { const i = PILL.indexOf(g); return i < 0 ? 0 : Math.min(i, 9) + (i === 12 ? 1 : 0); };
  // 数字滚动
  function countUp(root) {
    root.querySelectorAll('[data-count]').forEach(el => {
      const to = Number(el.dataset.count), t0 = performance.now(), dur = 900 + Math.random() * 400;
      const step = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = Math.round(to * e).toLocaleString('en-US'); if (k < 1) requestAnimationFrame(step); };
      requestAnimationFrame(step);
    });
  }
  return { D, MAJORS, esc, realm, stage, attr, grade, SOULS, SOUL_STAGE, PILL, pill, countUp };
})();

 if(t.classList.contains('heart')){t.classList.toggle('open');t.setAttribute('aria-expanded',t.classList.contains('open'));return}
 if(t.id==='stele'||t.id==='lotus'){renderBody();return}
 if(t.dataset.setting){settings[t.dataset.setting]=t.dataset.value;save();render(true);return}
 if(t.dataset.link){linkOpen=linkOpen===t.dataset.link?'':t.dataset.link;renderBody(true);return}
 if(t.dataset.restore){delete settings.avatars[t.dataset.restore];save();render(true);return}
 if(t.id==='reset'){if(!clearArmed){clearArmed=true;renderBody(true);return}audio.pause();audio.removeAttribute('src');settings=defaults();selectedTrack=0;linkOpen='';clearArmed=false;save();DP_HOST.switchTheme(settings.theme);return}
 if(t.dataset.music){if(!settings.tracks.length)return toast('先加入一首配乐。');if(t.dataset.music==='toggle'){if(!audio.paused){audio.pause();renderBody(true)}else await play(selectedTrack)}else await play(selectedTrack+(t.dataset.music==='next'?1:-1));return}
 if(t.dataset.play!==undefined)return play(Number(t.dataset.play));
 if(t.dataset.removeTrack!==undefined){const i=Number(t.dataset.removeTrack);if(i===selectedTrack){audio.pause();audio.removeAttribute('src')}settings.tracks.splice(i,1);if(i<selectedTrack)selectedTrack--;selectedTrack=Math.max(0,Math.min(selectedTrack,settings.tracks.length-1));save();renderBody(true)}
});
document.addEventListener('submit',e=>{if(!e.target.matches('#track-form,[data-avatar-form]'))return;e.preventDefault();const f=new FormData(e.target),url=String(f.get('url')).trim();try{if(!/^https?:$/.test(new URL(url).protocol))throw 0}catch{return toast('请填写有效的 http 或 https 链接。')}
 if(e.target.id==='track-form')settings.tracks.push({url,title:String(f.get('title')).trim()||'未命名曲目'});else{settings.avatars[e.target.dataset.avatarForm]=url;linkOpen=''}save();render(true)
});
document.addEventListener('change',async e=>{const n=e.target.dataset.upload;if(!n)return;const file=e.target.files[0];if(!file)return;if(!file.type.startsWith('image/'))return toast('请选择图片。');try{const bmp=await createImageBitmap(file),cv=document.createElement('canvas');cv.width=cv.height=256;const c=cv.getContext('2d'),side=Math.min(bmp.width,bmp.height);c.drawImage(bmp,(bmp.width-side)/2,(bmp.height-side)/2,side,side,0,0,256,256);settings.avatars[n]=cv.toDataURL('image/webp',.86);bmp.close();save();render(true)}catch{toast('图片读取失败，请换一张图片。')}});
document.addEventListener('input',e=>{if(e.target.id==='volume'){settings.volume=Number(e.target.value);audio.volume=settings.volume;save()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel();if(e.target.matches('[role=tab]')&&['ArrowRight','ArrowLeft','ArrowUp','ArrowDown','Home','End'].includes(e.key)){e.preventDefault();let i=TABS.findIndex(([id])=>id===tab);i=e.key==='Home'?0:e.key==='End'?TABS.length-1:(i+(['ArrowRight','ArrowDown'].includes(e.key)?1:-1)+TABS.length)%TABS.length;go(TABS[i][0]);document.querySelector(`[data-tab="${tab}"]`)?.focus()}});
matchMedia('(prefers-reduced-motion:reduce)').addEventListener('change',()=>{if(settings.motion==='auto')render(true)});
document.addEventListener('error',e=>{if(e.target.tagName==='IMG'){const span=document.createElement('span');span.textContent=Array.from(e.target.alt.replace('的头像',''))[0]||'人';e.target.replaceWith(span)}},true);

document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});

document.body.insertAdjacentHTML('beforeend','<div id="toast" role="status" hidden></div>');
apply();renderDock();if(typeof renderRail==='function')renderRail();else renderTabs();
tab=PAGES[DP_HOST.tab]?DP_HOST.tab:'hero';go(tab);
if(DP_HOST.open===false)closePanel();
document.addEventListener('click',()=>{DP_HOST.open=document.querySelector('#dp').dataset.open==='true'});
window.DoupoStatus={getData:()=>S};
</script><script>PAGES.fate=function(){
  const t=S.时空,g=S.原作指导,events=Object.entries(g.事件||{}).sort(([a],[b])=>a.localeCompare(b,'zh',{numeric:true}));
  const butterflies=Object.entries(S.蝴蝶效应||{}),changes=Object.entries(S.永久改写||{});
  const text=v=>esc(String(v??'')), section=(name,n,body)=>'<section><h3>'+name+(n?'<small>'+text(n)+'</small>':'')+'</h3>'+body+'</section>';
  const pair=(label,value)=>value?'<div><dt>'+label+'</dt><dd>'+text(value)+'</dd></div>':'';
  const brief='<header><small>'+[t.当前部,t.当前篇,t.时层,g.来源==='前史篇'?g.来源:''].filter(Boolean).map(text).join('　·　')+'</small><h2>'+text(t.当前幕||g.幕||'幕间')+'</h2><dl>'+pair('外界日期',t.外界日期)+pair('场景日期',t.场景日期)+pair('所在',t.地点)+'</dl></header>';
  const timeline=events.map(([id,e])=>{
    const active=id===g.当前事件,links=(e.关联蝴蝶||[]).map(b=>S.蝴蝶效应[b]?'<button type="button" data-guide-link="'+text(b)+'">'+text(b)+'</button>':text(b)).join(' ');
    return '<li'+(active?' aria-current="step"':'')+'><div><b>'+text(e.标题)+'</b><small>'+(active?'当前 · ':'')+text(e.状态)+'</small></div><time>'+text(e.日期)+'</time>'+(e.原因?'<p>'+text(e.原因)+'</p>':'')+(links?'<p>'+links+'</p>':'')+'</li>';
  }).join('');
  const deviations=butterflies.map(([id,b])=>'<article tabindex="-1" data-guide-effect="'+text(id)+'"><h4>'+text(b.名称)+'<small>'+text(b.状态)+'</small></h4><time>'+[b.发生于?.日期,b.发生于?.幕].filter(Boolean).map(text).join(' · ')+'</time><dl class="guide-fork">'+pair('原作走向',b.原作走向)+pair('实际走向',b.实际走向)+'</dl>'+(b.波及?.length?'<p>波及　'+b.波及.map(text).join('、')+'</p>':'')+'</article>').join('');
  return '<div class="dp-guide" data-skin="'+DP_HOST.theme+'">'+brief+(t.跳时总结?section('跳时总结','','<p>'+text(t.跳时总结)+'</p>'):'')+
    section('原作指导',events.length?events.filter(([,e])=>e.状态!=='未发生').length+' / '+events.length+' 已有结果':'',(timeline?'<ol>'+timeline+'</ol>':'<p>当前没有可对照的事件。</p>')+(t.下一幕?'<footer>下一幕　'+text(t.下一幕)+'</footer>':''))+
    section('蝴蝶效应',butterflies.length?String(butterflies.length):'',deviations||'<p>本幕尚无偏离记录。</p>')+
    section('永久改写',changes.length?String(changes.length):'',changes.map(([,c])=>'<p><small>'+text(c.影响范围)+'</small>　'+text(c.内容)+'</p>').join('')||'<p>尚无已定局的改写。</p>')+'</div>';
};
document.addEventListener('click',event=>{
  const key=event.target.closest('[data-guide-link]')?.dataset.guideLink;
  if(key){const el=document.querySelector('[data-guide-effect="'+CSS.escape(key)+'"]');el?.focus({preventScroll:true});el?.scrollIntoView({block:'nearest'});}
});
if(DP_HOST.tab==='fate')renderBody();
</script><script>function installGallery(doc,host,openInParent){
  const drawer=doc.createElement('dialog');drawer.className='dp-art-view';drawer.setAttribute('aria-label','人物立绘');
  const picture=doc.createElement('img'),caption=doc.createElement('strong'),number=doc.createElement('span');
  function button(label,action){const b=doc.createElement('button');b.type='button';b.textContent=label;b.onclick=action;return b;}
  let current='';
  const choose=delta=>{const total=host.portraitList(current).length;
    host.choosePortrait(current,(host.portraitIndex(current)+delta+total)%total);update();};
  const prev=button('上一张',()=>choose(-1)),next=button('下一张',()=>choose(1)),close=button('关闭',()=>drawer.close());
  const bar=doc.createElement('div');bar.append(prev,number,next,close);drawer.append(caption,picture,bar);
  function update(){
    const n=host.portraitList(current).length;
    caption.textContent=current;number.textContent=(host.portraitIndex(current)+1)+' / '+n;
    picture.src=host.portraitUrl(current);picture.alt=current+'立绘';prev.disabled=next.disabled=n<2;
  }
  function showName(name){
    current=name;update();
    if(!drawer.isConnected)doc.body.append(drawer);
    if(!drawer.open)drawer.showModal();
  }
  if(!openInParent)host.showPortrait=showName;
  function show(e){
    if(e.type==='keydown'&&!['Enter',' '].includes(e.key))return;
    const el=e.composedPath().find(n=>n?.dataset?.gallery);
    if(!el||!host.portraitList(el.dataset.gallery).length)return;
    e.preventDefault();e.stopPropagation();(openInParent||showName)(el.dataset.gallery);
  }
  doc.addEventListener('click',show,true);doc.addEventListener('keydown',show,true);
  return ()=>{doc.removeEventListener('click',show,true);doc.removeEventListener('keydown',show,true);drawer.remove();};
}
const statusHost=window.frameElement.dpView, statusFrame=window.frameElement;
installGallery(document,statusHost,name=>parent.__doupoArt?.showPortrait(name));
const panelRoot=document.querySelector('#dp'),dockRoot=document.querySelector('#dock');
function sizeDock(){
  const h=Math.max(40,Math.ceil(dockRoot.getBoundingClientRect().height));
  const open=panelRoot.dataset.open==='true';
  statusHost.open=open;
  document.documentElement.style.setProperty('--dock-height',h+'px');
  statusFrame.parentElement.style.height=h+'px';
  statusFrame.style.height=open?'min(calc(100dvh - 100px), '+(h+595)+'px)':h+'px';
  document.querySelector('#panel').inert=!open;
}
function dockPortrait(){
  const id=dockRoot.querySelector('.dk-id'),name=statusHost.data.主角.姓名;
  if(!id||id.classList.contains('ms-who')||id.querySelector('.dp-face')||!statusHost.portraitList(name).length)return;
  const b=document.createElement('button');b.type='button';b.className='dp-face';b.dataset.gallery=name;b.setAttribute('aria-label','查看'+name+'立绘');
  const img=new Image();img.dataset.originalName=name;img.alt=name;img.src=statusHost.portraitUrl(name);b.append(img);id.prepend(b);
}
new ResizeObserver(sizeDock).observe(dockRoot);
new MutationObserver(sizeDock).observe(panelRoot,{attributes:true,attributeFilter:['data-open']});
new MutationObserver(dockPortrait).observe(dockRoot,{childList:true});
sizeDock();dockPortrait();
</script></body>
